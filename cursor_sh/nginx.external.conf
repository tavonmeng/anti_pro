server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 201m;

    # 统一到 www 主域名，保留现有用户在 www 下的登录状态。
    if ($host = uniquevisionx.com) {
        return 308 https://www.uniquevisionx.com$request_uri;
    }

    # ===== External 模式：屏蔽管理后台和承包商页面 =====
    location /admin {
        return 302 /;
    }

    location /contractor {
        return 302 /;
    }

    location /staff {
        return 302 /;
    }

    # 生产环境不公开 API 文档入口
    location ~ ^/(docs|redoc|openapi\.json|api/docs|api/redoc|api/openapi\.json)$ {
        return 404;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 官网首页是唯一公开索引页。
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 登录、注册和用户工作台可访问，但不应进入搜索结果。
    location ~ ^/(?:login|register|user)(?:/|$) {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 其他未知路径返回真实 404，避免 SPA fallback 形成软 404。
    location / {
        try_files $uri $uri/ =404;
    }

    # 后端 API 反向代理
    location /api/ {
        set $backend_server http://backend:8000;
        proxy_pass $backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 201m;
    }

    # AI 聊天接口（SSE 流式响应）
    location /ai/ {
        set $backend_server http://backend:8000;
        proxy_pass $backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 用户上传文件
    location /uploads/ {
        set $backend_server http://backend:8000;
        proxy_pass $backend_server;
    }

    # 静态案例资源
    location /static/ {
        set $backend_server http://backend:8000;
        proxy_pass $backend_server;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
}
