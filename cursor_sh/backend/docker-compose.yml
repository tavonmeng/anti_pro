services:
  # 后端 API 服务
  backend:
    image: anti_pro-backend
    build: .
    container_name: anti-pro-backend
    # ⭐ 关键：从 .env 文件加载所有环境变量到容器内部
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  # 前端 Nginx 服务
  frontend:
    image: anti_pro-frontend
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: anti-pro-frontend
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-all}
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
